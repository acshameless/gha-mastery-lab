name: "01 - Hello GitHub Actions"
run-name: "Learning run by ${{ github.actor }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello:
    name: Inspect a Linux runner
    runs-on: ubuntu-24.04

    steps:
      - name: Print GitHub context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          printf 'event=%s\n' "$EVENT_NAME"
          printf 'repository=%s\n' "$REPOSITORY"
          printf 'ref=%s\n' "$REF_NAME"
          printf 'actor=%s\n' "$ACTOR"

      - name: Inspect runner environment
        run: |
          printf 'host='
          hostname

          printf 'user='
          whoami

          printf 'workspace=%s\n' "$GITHUB_WORKSPACE"

          uname -a

      - name: Complete
        run: echo "My first workflow succeeded!"
